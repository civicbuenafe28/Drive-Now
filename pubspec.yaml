name: drivenow
description: "DriveNow - car rental app (Flutter port of the SwiftUI iOS app)."
publish_to: 'none'
version: 2.0.1+3

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase (same backend as the iOS app). If Firebase isn't configured for
  # Android yet, the app automatically falls back to on-device accounts.
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # Local storage (replaces UserDefaults)
  shared_preferences: ^2.3.2

  # Profile photo picker (replaces PhotosPicker)
  image_picker: ^1.1.2

  # Map for choosing the pickup location (replaces MapKit) - OpenStreetMap, no API key needed
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  http: ^1.2.2

  # Hashing for offline (local) accounts
  crypto: ^3.0.5

  # "Remember me" — email + password stored encrypted (Android Keystore)
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
